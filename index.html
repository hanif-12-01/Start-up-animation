<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="description"
    content="WattWise Operating Simulator — interactive startup simulation platform."
  />

  <title>WattWise Operating Simulator</title>

  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #07111f;
      color: #f8fafc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at top,
          rgba(16, 185, 129, 0.15),
          transparent 38rem
        ),
        #07111f;
    }

    main {
      width: min(720px, calc(100% - 40px));
      padding: 48px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 24px;
      background: rgba(15, 23, 42, 0.72);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: #34d399;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
    }

    .status {
      display: inline-flex;
      margin-top: 20px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(52, 211, 153, 0.28);
      color: #6ee7b7;
      font-size: 0.85rem;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">WattWise</p>

    <h1>Operating Simulator</h1>

    <p>
      Repository baseline has been normalized.
      The simulation engine and interactive interface
      will be implemented in the appropriate future phases.
    </p>

    <div class="status">
      Repository foundation ready
    </div>
  </main>
</body>
</html>
